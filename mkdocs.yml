site_name: Live
site_description: Live — компьютерная игра по мотивам русской рулетки
site_url: https://caseyjohnson-rs.github.io/Live/
copyright: © 2026 Casey Johnson. Все права защищены.

# С --strict любое из этого роняет сборку: битый якорь (например, в
# глоссарии), ссылка в никуда, страница, которой нет в навигации
validation:
  omitted_files: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: ru
  font:
    text: Exo 2
    code: IBM Plex Mono
  logo: logo.svg
  favicon: favicon.svg
  # Только тёмная схема: палитра «Бутылочное стекло» — в stylesheets/palette.css
  # custom — чтобы встроенные цвета Material не перебивали наши роли
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy

extra:
  # Без строки «Made with Material for MkDocs» в подвале
  generator: false
  # Контакты — иконками в подвале, рядом с копирайтом
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CaseyJohnson-RS
      name: GitHub
    - icon: fontawesome/brands/telegram
      link: https://t.me/casey_johnson
      name: Telegram
    - icon: fontawesome/solid/envelope
      link: mailto:casey.johnson.r@yandex.ru
      name: casey.johnson.r@yandex.ru

# Порядок важен: при равной специфичности побеждает то, что подключено позже
extra_css:
  - stylesheets/palette.css
  - stylesheets/base.css
  - stylesheets/cards.css
  - stylesheets/rules.css

# Формулы (MathJax); точная версия, чтобы сайт не менялся сам
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

plugins:
  - search:
      lang: ru

markdown_extensions:
  - toc:
      permalink: true
      # Стандартный slugify выбрасывает кириллицу — якоря вида #выстрел ломаются
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Правила:
      - rules/index.md
      - rules/structure.md
      - Элементы:
          - rules/elements/index.md
          - rules/elements/player.md
          - rules/elements/chamber-row.md
          - rules/elements/hand.md
          - rules/elements/chips.md
      - Игровой цикл:
          - rules/chapters/index.md
          - rules/chapters/game.md
          - rules/chapters/round.md
          - rules/chapters/spread.md
          - rules/chapters/turn.md
      - Предметы:
          - rules/items/index.md
          - Знание:
              - rules/items/one-eye.md
              - rules/items/wide-eyes.md
          - Ряд:
              - rules/items/reverse.md
              - rules/items/more.md
              - rules/items/scared.md
              - rules/items/peek.md
              - rules/items/shake.md
          - Жизни:
              - rules/items/water.md
              - rules/items/dubious.md
              - rules/items/like-new.md
          - Ход:
              - rules/items/pass.md
              - rules/items/double.md
              - rules/items/full-force.md
              - rules/items/shield.md
          - Соперники:
              - rules/items/try-this.md
              - rules/items/play-along.md
              - rules/items/share.md
          - Фишки:
              - rules/items/jackpot.md
      - rules/visibility.md
      - rules/parameters.md
      - Глоссарий: rules/glossary.md
  - Движок:
      - engine/index.md
      - Архитектура:
          - Обзор: engine/architecture/README.md
          - Гексагональная архитектура: engine/architecture/zen/hexarch.md
          - Принципы: engine/architecture/zen/principles.md
          - Доменный слой:
              - engine/architecture/domain/README.md
              - Модель данных: engine/architecture/domain/state.md
              - Правила: engine/architecture/domain/rules.md
          - engine/architecture/application/README.md
          - engine/architecture/adapters/README.md
      - Решения:
          - engine/decisions/README.md
          - engine/decisions/0001-shot-is-an-item.md
          - engine/decisions/0002-round-is-row-and-layouts.md
          - engine/decisions/0003-rules-are-domain-functions.md
          - engine/decisions/0004-client-builds-world-view.md
          - engine/decisions/0005-fair-first-move-on-the-fly.md
          - engine/decisions/0006-mutable-entities-in-repository.md
          - engine/decisions/0007-sampler-outside-core.md
          - engine/decisions/0008-match-not-party.md
          - engine/decisions/0009-revealed-positions-in-round.md
          - engine/decisions/0010-semantic-messages.md
          - engine/decisions/0011-rules-return-events-and-messages.md
          - engine/decisions/0012-immutable-state-pure-rules.md
          - engine/decisions/0013-events-and-visibility-function.md
          - engine/decisions/0014-code-names-follow-rules.md
          - engine/decisions/0015-effects-are-data.md
          - engine/decisions/0016-spread-start-is-one-step.md
  - Клиент: client/index.md
