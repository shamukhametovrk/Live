[project]
name = "livebot"
version = "0.1.0"
description = "Bot client for the Live engine: joins over WebSocket and plays randomly"
requires-python = ">=3.15"
dependencies = ["websockets>=17.3"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.9"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 80
target-version = "py315"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
