name: engine

on:
  push:
    paths: [engine/**, .github/workflows/engine.yml]
  pull_request:
    paths: [engine/**, .github/workflows/engine.yml]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
